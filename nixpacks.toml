[phases.setup];
nixPkgs = [
    "php82",
    "php82Extensions.mbstring",
    "php82Extensions.xml",
    "php82Extensions.tokenizer",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.curl",
    "php82Extensions.zip",
    "php82Extensions.gd",
    "composer",
    "nodejs_20",
    "npm-9_x",
][phases.build];
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build",
][start];
cmd =
    "php artisan migrate --force && php artisan storage:link && php -S 0.0.0.0:$PORT -t public";
